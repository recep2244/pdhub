# Protein Design Hub — "Phosphor Lab" theme.
# Precision-instrument dark UI: cool ink base, single aquamarine signal accent,
# Hanken Grotesk (UI) + IBM Plex Mono (data). Fonts are loaded via the @import
# in web/ui.py THEME_CSS; these names just point Streamlit's native chrome at them.
[theme]
base = "dark"
primaryColor = "#3fe0c5"                 # signal aquamarine — primary action, focus, active state
backgroundColor = "#080b0f"              # app ink
secondaryBackgroundColor = "#0e151b"     # cards, sidebar, inputs, tables
textColor = "#e7eef2"                    # body text
linkColor = "#6bf0d8"                    # links — lighter signal for contrast
borderColor = "#1d2730"                  # hairline widget/card borders
codeBackgroundColor = "#0c1218"
font = "Hanken Grotesk, sans-serif"
headingFont = "Hanken Grotesk, sans-serif"
codeFont = "IBM Plex Mono, monospace"
baseRadius = "0.4rem"                     # tighter corners → precise / instrument-like

# Semantic palette — status text, st.metric deltas, sparklines.
redColor = "#ff5d6c"
orangeColor = "#ffb454"
yellowColor = "#f5c451"
greenColor = "#56d364"
blueColor = "#4cc9f0"

[client]
showErrorDetails = true
toolbarMode = "minimal"

[server]
runOnSave = false
